<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telemetry & GPS - Road Damage Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body>

<!-- ---------------- SIDEBAR ---------------- -->
<div class="sidebar">
    <div class="sidebar-header">
        <a href="/" class="logo-link"><img src="/static/images/logo.png" class="brand-logo" alt="Veethi Shield Logo"></a>
        <h2>Veethi Shield</h2>
    </div>
    
    <div class="sidebar-section-title">Operational Hub</div>
    <a href="/scan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 12px;"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        Command Center
    </a>
    <a href="/webcam">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 12px;"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        Live Camera
    </a>
    <a href="/history">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 12px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
        Analysis History
    </a>
    
    <div class="sidebar-section-title" style="margin-top: 24px;">Systems</div>
    <a href="/telemetry" class="active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 12px;"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        Telemetry & GPS
    </a>
</div>

<!-- ---------------- MAIN CONTENT ---------------- -->
<div class="container">
    <!-- TOP RIGHT BRAND INDICATOR -->

    <div class="header-area">
        <div>
            <h1 class="header-title">Geographic Intelligence</h1>
            <p class="header-subtitle">Global spatial distribution of road infrastructure damage</p>
        </div>
        <div style="font-size: 12px; font-weight: 600; color: #2563eb; background: #eff6ff; padding: 6px 14px; border-radius: 9999px;">
            {{ history|length }} ACTIVE DETECTION SITES
        </div>
    </div>

    <!-- MAIN MAP CARD -->
    <div class="card" style="padding: 0; overflow: hidden;">
        <div style="padding: 24px; border-bottom: 1px solid var(--border-color); background: rgba(255,255,255,0.02);">
            <h3 style="margin: 0; font-size: 16px;">Pothole Detected Regions</h3>
        </div>
        <div id="telemetry-map" style="width: 100%; height: 600px;"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            var historyData = {{ history|tojson }};
            var map = L.map('telemetry-map').setView([12.9716, 80.2446], 11);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            historyData.forEach(function(item) {
                if (item.latitude && item.longitude) {
                    var color = item.severity === 'High' ? '#ef4444' : (item.severity === 'Medium' ? '#f59e0b' : '#10b981');
                    var marker = L.circleMarker([item.latitude, item.longitude], {
                        radius: 10,
                        fillColor: color,
                        color: "#fff",
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.8
                    }).addTo(map);
                    
                    marker.bindPopup(`
                        <div style="font-family: 'Inter', sans-serif; width: 220px;">
                            <div style="font-weight: 700; font-size: 14px; margin-bottom: 4px;">${item.type} Assessment</div>
                            <div style="font-size: 12px; color: #64748b; margin-bottom: 12px;">${item.timestamp}</div>
                            <div style="background: #f8fafc; padding: 8px; border-radius: 6px; border: 1px solid #e2e8f0; margin-bottom: 12px;">
                                <div style="font-size: 11px; color: #64748b; margin-bottom: 2px;">ZONE / AREA</div>
                                <div style="font-size: 13px; font-weight: 700; color: #2563eb; margin-bottom: 4px;">${item.specific_location || 'Unknown Area'}</div>
                                <div style="font-size: 11px; color: #64748b; margin-bottom: 2px;">FULL ADDRESS</div>
                                <div style="font-size: 12px; font-weight: 600; line-height: 1.4;">${item.location_name || 'Coordinates: ' + item.latitude + ', ' + item.longitude}</div>
                            </div>
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <span style="font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 4px; background: ${color}20; color: ${color};">
                                    ${item.severity.toUpperCase()}
                                </span>
                                <a href="/report/${item.id}" style="font-size: 12px; color: #2563eb; font-weight: 600; text-decoration: none;">Full Report &rarr;</a>
                            </div>
                        </div>
                    `);
                }
            });
        });
    </script>

</div>

</body>
</html>
